<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QuickGPT - Signup</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    :root {
      --bg: #ffffff;
      --text: #000000;
      --card-bg: #ffffff;
      --border: #e0e0e0;
      --input-bg: #f2f2f2;
      --purple: #7a2cff;
    }

    body.dark {
      --bg: #0b0b0f;
      --text: #ffffff;
      --card-bg: #14141b;
      --border: rgba(255,255,255,0.12);
      --input-bg: #1c1c26;
      --purple: #9a4dff;
    }

    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", sans-serif;
    }

    .signup-card {
      width: 450px;
      padding: 30px;
      border-radius: 18px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      box-shadow: 0px 10px 30px rgba(0,0,0,0.1);
    }

    .logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .logo-icon {
      width: 55px;
      height: 55px;
      border-radius: 14px;
      background: linear-gradient(135deg, #7a2cff, #5b6bff);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 22px;
      font-weight: bold;
      color: white;
    }

    .logo-text h2 {
      margin: 0;
      font-size: 22px;
      font-weight: 800;
    }

    .logo-text p {
      margin: 0;
      font-size: 14px;
      color: var(--purple);
      font-weight: 600;
    }

    .form-control {
      background: var(--input-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px;
      border-radius: 12px;
    }

    .form-control:focus {
      box-shadow: none;
      border-color: var(--purple);
    }

    .btn-signup {
      width: 100%;
      background: var(--purple);
      color: white;
      padding: 12px;
      font-weight: 700;
      border-radius: 12px;
      border: none;
      transition: 0.2s;
    }

    .btn-signup:hover {
      opacity: 0.9;
    }

    .text-small {
      font-size: 14px;
      text-align: center;
      margin-top: 15px;
    }

    .text-small a {
      color: var(--purple);
      font-weight: 700;
      text-decoration: none;
    }

    .dark-toggle {
      position: absolute;
      top: 20px;
      right: 20px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 600;
    }
  </style>
</head>

<body>

  <div class="dark-toggle" onclick="toggleDarkMode()">🌙 Dark</div>

  <div class="signup-card">

    <div class="logo">
      <div class="logo-icon">✨</div>
      <div class="logo-text">
        <h2>QuickGPT</h2>
        <p>Intelligent AI Assistant</p>
      </div>
    </div>

    <h4 class="text-center fw-bold mb-3">Create Account</h4>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }}" role="alert">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST" action="/signup">
      <div class="mb-3">
        <input type="text" class="form-control" name="name" placeholder="Full Name" required>
      </div>

      <div class="mb-3">
        <input type="email" class="form-control" name="email" placeholder="Email" required>
      </div>

      <div class="mb-3">
        <input type="password" class="form-control" name="password" placeholder="Password" required>
      </div>

      <div class="mb-3">
        <input type="password" class="form-control" name="confirm_password" placeholder="Confirm Password" required>
      </div>

      <button type="submit" class="btn-signup">Create Account</button>
    </form>

    <div class="text-small">
      Already have an account? <a href="/login">Login</a>
    </div>

  </div>

  <script>
    function toggleDarkMode() {
      document.body.classList.toggle("dark");
    }
  </script>

</body>
</html>
