<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI Chatbot</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
    body {
        margin: 0;
        height: 100vh;
        overflow: hidden;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #a18cd1, #fbc2eb);
    }

    .page-wrapper {
    height: 100vh;
    max-width: 1400px;
    margin: 0 auto;
    padding: 24px;
    box-sizing: border-box;
}

    .chat-layout {
    display: grid;
    grid-template-columns: 320px 1fr;
    gap: 20px;
    height: 100%;
}

    .sidebar {
    background: rgba(255, 255, 255, 0.95);
    border-radius: 24px;
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.12);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    height: 100%;
}

    .sidebar-header {
        padding: 20px;
        border-bottom: 1px solid #ece7ff;
        display: flex;
        align-items: center;
        justify-content: space-between;
    }

    .sidebar-header h2 {
        margin: 0;
        font-size: 18px;
        font-weight: 700;
    }

    .sidebar-body {
    flex: 1;
    overflow-y: auto;
    padding: 12px 0;
}

    .chat-item {
        padding: 14px 18px;
        margin: 0 16px 8px;
        border-radius: 16px;
        background: #f8f6ff;
        cursor: pointer;
        transition: background 0.2s ease;
    }

    .chat-item.active,
    .chat-item:hover {
        background: #7b2cbf;
        color: white;
    }

    .chat-item-title {
        font-weight: 700;
        margin-bottom: 6px;
    }

    .chat-item-meta {
        font-size: 13px;
        color: #6c6c8a;
    }

    .chat-panel {
    background: rgba(255, 255, 255, 0.96);
    border-radius: 24px;
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.12);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    height: 100%;
}

    .chat-topbar {
        padding: 20px 24px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid #ece7ff;
        background: #7b2cbf;
        color: white;
    }

    .chat-title {
        margin: 0;
        font-size: 20px;
        font-weight: 800;
    }

    .chat-body {
    flex: 1;
    padding: 24px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
    background: #f8f6ff;
}

    .message {
        padding: 14px 18px;
        border-radius: 20px;
        max-width: 75%;
        opacity: 0;
        transform: translateY(10px);
        animation: fadeInUp 0.24s forwards;
        white-space: pre-wrap;
        line-height: 1.5;
    }

    .message.user {
        background: linear-gradient(135deg, #7b2cbf, #9d4edd);
        color: white;
        align-self: flex-end;
        border-bottom-right-radius: 4px;
    }

    .message.bot {
        background: white;
        color: #1f1f2b;
        border: 1px solid #e4e1f7;
        align-self: flex-start;
        border-bottom-left-radius: 4px;
    }
    .chat-body::-webkit-scrollbar,
.sidebar-body::-webkit-scrollbar {
    width: 8px;
}

.chat-body::-webkit-scrollbar-track,
.sidebar-body::-webkit-scrollbar-track {
    background: transparent;
}

.chat-body::-webkit-scrollbar-thumb,
.sidebar-body::-webkit-scrollbar-thumb {
    background: rgba(123, 44, 191, 0.4);
    border-radius: 20px;
}

.chat-body::-webkit-scrollbar-thumb:hover,
.sidebar-body::-webkit-scrollbar-thumb:hover {
    background: rgba(123, 44, 191, 0.7);
}

@media (max-width: 992px) {

    body {
        overflow: auto;
        height: auto;
    }

    .page-wrapper {
        height: auto;
    }

    .chat-layout {
        grid-template-columns: 1fr;
        height: auto;
    }

    .sidebar {
        max-height: 260px;
    }

    .chat-panel {
        height: calc(100vh - 340px);
    }
}

    @keyframes fadeInUp {
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .chat-footer {
        padding: 18px;
        display: flex;
        align-items: center;
        gap: 12px;
        background: #f2efff;
        border-top: 1px solid #ece7ff;
    }

    .chat-input {
        flex: 1;
        border-radius: 999px;
        border: 1px solid #ccc;
        padding: 14px 18px;
        font-size: 16px;
        outline: none;
    }

    .send-button {
        width: 52px;
        height: 52px;
        border-radius: 50%;
        border: none;
        background: #7b2cbf;
        color: white;
        font-size: 20px;
        display: grid;
        place-items: center;
        cursor: pointer;
    }

    .typing {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        background: white;
        border: 1px solid #ddd;
        padding: 12px 16px;
        border-radius: 18px;
        color: #666;
        font-size: 14px;
        align-self: flex-start;
    }

    .typing span {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #7b2cbf;
        animation: blink 1.2s infinite ease-in-out;
    }

    .typing span:nth-child(2) { animation-delay: 0.15s; }
    .typing span:nth-child(3) { animation-delay: 0.3s; }

    @keyframes blink {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 1; }
    }

    .empty-state {
        color: #6C6C8A;
        text-align: center;
        padding: 40px 20px;
    }

    @media (max-width: 992px) {
        .chat-layout {
            grid-template-columns: 1fr;
        }

        .sidebar {
            max-height: 320px;
        }

        .chat-panel {
            min-height: 600px;
        }
    }
    .chat-item-top {
    display: flex;
    justify-content: space-between;
    align-items: start;
    gap: 10px;
}

.chat-menu-btn {
    border: none;
    background: transparent;
    color: inherit;
    font-size: 20px;
    line-height: 1;
    cursor: pointer;
    padding: 0 4px;
}

.chat-menu-btn:hover {
    opacity: 0.7;
}

.dropdown-menu {
    border: none;
    border-radius: 14px;
    padding: 8px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.12);
}

.dropdown-item {
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 14px;
}
</style>
</head>
<body>
<div class="page-wrapper">
    <div class="chat-layout">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>Recent chats</h2>
                <button id="new-chat-btn" class="btn btn-sm btn-light">New</button>
            </div>
            <div class="sidebar-body" id="chat-list">
                <div class="empty-state">Loading chats…</div>
            </div>
        </aside>

        <section class="chat-panel">
            <div class="chat-topbar">
                <div>
                    <p class="chat-title" id="chat-title">New Chat</p>
                    <small id="chat-subtitle">Start a conversation or choose a recent thread.</small>
                </div>
                <div>
                    <a href="/logout" class="btn btn-sm btn-outline-light">Logout</a>
                </div>
            </div>

            <div id="chat-body" class="chat-body">
                <div class="empty-state">Select a chat from the left or create a new one.</div>
            </div>

            <div class="chat-footer">
                <input id="message-input" class="chat-input" type="text" placeholder="Type your message...">
                <button id="send-button" class="send-button">➤</button>
            </div>
        </section>
    </div>
</div>

<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
let selectedChatId = null;
let selectedChatTitle = "New Chat";

$(function() {
    loadRecentChats();

    $("#new-chat-btn").on("click", function() {
        createNewChat();
    });

    $("#send-button").on("click", function() {
        sendMessage();
    });

    $("#message-input").on("keypress", function(e) {
        if (e.which === 13) {
            e.preventDefault();
            sendMessage();
        }
    });
});

function loadRecentChats() {
    $.get("/recent-chats", function(chats) {
        const list = $("#chat-list");
        list.empty();

        if (!chats.length) {
            list.html('<div class="empty-state">No chats yet. Create a new chat to begin.</div>');
            return;
        }

        chats.forEach(chat => {
            const item = $(`
    <div class="chat-item"
         data-chat-id="${chat.id}"
         data-chat-title="${chat.title}">

        <div class="chat-item-top">

            <div class="chat-item-title">
                ${chat.title}
            </div>

            <div class="dropdown">

                <button
                    class="chat-menu-btn"
                    data-bs-toggle="dropdown">

                    ⋯

                </button>

                <ul class="dropdown-menu dropdown-menu-end">

                    <li>
                        <a class="dropdown-item" href="#">
                            🔗 Share
                        </a>
                    </li>

                    <li>
                        <a class="dropdown-item rename-chat" href="#">
                            ✏️ Rename
                        </a>
                    </li>

                    <li>
                        <a class="dropdown-item" href="#">
                            📌 Pin Chat
                        </a>
                    </li>

                    <li>
                        <a class="dropdown-item" href="#">
                            🗂️ Archive
                        </a>
                    </li>

                    <li>
                        <a class="dropdown-item text-danger delete-chat" href="#">
                            🗑️ Delete
                        </a>
                    </li>

                </ul>

            </div>

        </div>

        <div class="chat-item-meta">
            ${new Date(chat.created_at).toLocaleString()}
        </div>

    </div>
`);

            item.on("click", function() {
                selectChat(chat.id, chat.title);
            });
            item.find(".delete-chat").on("click", function(e) {

               e.stopPropagation();
               e.preventDefault();

               if (!confirm("Delete this chat permanently?")) {
               return;
               }

               deleteChat(chat.id);

               });

            list.append(item);
        });

        if (!selectedChatId) {
            const firstChat = chats[0];
            selectChat(firstChat.id, firstChat.title);
        }
    }).fail(function() {
        $("#chat-list").html('<div class="empty-state">Unable to load chats.</div>');
    });
}

function createNewChat() {
    $.ajax({
        url: "/new-chat",
        type: "POST",
        contentType: "application/json",
        data: JSON.stringify({ title: "New Chat" }),
        success: function(data) {
            selectedChatId = data.chat_id;
            selectedChatTitle = data.title;
            $("#chat-title").text(selectedChatTitle);
            $("#chat-body").empty();
            loadRecentChats();
            $("#chat-subtitle").text("Your new chat is ready.");
        },
        error: function() {
            alert("Unable to create a new chat. Please refresh or try again.");
        }
    });
}

function selectChat(chatId, title) {
    selectedChatId = chatId;
    selectedChatTitle = title;
    $("#chat-title").text(title);
    $("#chat-subtitle").text("Loading chat messages...");
    $("#chat-list .chat-item").removeClass("active");
    $(`#chat-list .chat-item[data-chat-id='${chatId}']`).addClass("active");
    loadMessages(chatId);
}

function loadMessages(chatId) {
    $.get(`/chat-messages/${chatId}`, function(messages) {
        const body = $("#chat-body");
        body.empty();

        if (!messages.length) {
            body.html('<div class="empty-state">No messages yet. Send the first message to start the conversation.</div>');
            $("#chat-subtitle").text("Start a new conversation.");
            return;
        }

        messages.forEach(msg => {
            appendMessage(msg.message, msg.sender, false);
        });

        $("#chat-subtitle").text(`Last updated ${new Date(messages[messages.length-1].created_at).toLocaleString()}`);
        scrollToBottom();
    }).fail(function() {
        $("#chat-body").html('<div class="empty-state">Unable to load messages.</div>');
        $("#chat-subtitle").text("Could not load messages.");
    });
}

function sendMessage() {
    const message = $("#message-input").val().trim();
    if (!message) return;
    if (!selectedChatId) {
        createNewChat();
        return;
    }
    if (selectedChatTitle === "New Chat") {

    const newTitle =
        message.length > 30
        ? message.substring(0, 30) + "..."
        : message;

    selectedChatTitle = newTitle;

    $("#chat-title").text(newTitle);

    $(`#chat-list .chat-item[data-chat-id='${selectedChatId}'] .chat-item-title`)
        .text(newTitle);

    updateChatTitle(selectedChatId, newTitle);
}

    appendMessage(message, "user", true);
    $("#message-input").val("");
    const typingId = appendTyping();

    $.ajax({
        url: "/chat",
        type: "POST",
        contentType: "application/json",
        data: JSON.stringify({ message, chat_id: selectedChatId }),
        success: function(data) {
            removeTyping(typingId);
            if (data.chat_id && !selectedChatId) {
                selectedChatId = data.chat_id;
            }
            appendMessage(data.reply, "bot", true);
            $("#chat-subtitle").text(`Last updated ${new Date().toLocaleString()}`);
            loadRecentChats();
        },
        error: function() {
            removeTyping(typingId);
            appendMessage("⚠️ Error: Could not send message.", "bot", true);
        }
    });
}

function updateChatTitle(chatId, title) {

    $.ajax({
        url: "/update-chat-title",
        type: "POST",
        contentType: "application/json",

        data: JSON.stringify({
            chat_id: chatId,
            title: title
        })
    });
    function deleteChat(chatId) {

    $.ajax({
        url: "/delete-chat",
        type: "POST",
        contentType: "application/json",

        data: JSON.stringify({
            chat_id: chatId
        }),

        success: function() {

            if (selectedChatId === chatId) {

                selectedChatId = null;
                selectedChatTitle = "New Chat";

                $("#chat-title").text("New Chat");

                $("#chat-subtitle")
                    .text("Start a conversation or choose a recent thread.");

                $("#chat-body").html(`
                    <div class="empty-state">
                        Select a chat from the left or create a new one.
                    </div>
                `);
            }

            loadRecentChats();
        },

        error: function() {
            alert("Unable to delete chat.");
        }
    });

}

}

function appendMessage(text, sender, animate = true) {
    if (!text) return;
    const messageEl = $(`<div class="message ${sender}">${text}</div>`);
    if (!animate) {
        messageEl.css({ opacity: 1, transform: 'none' });
    }
    $("#chat-body").append(messageEl);
    scrollToBottom();
}

function appendTyping() {
    const typingId = "typing-" + Date.now();
    const typingEl = $(
        `<div id="${typingId}" class="typing"><span></span><span></span><span></span></div>`
    );
    $("#chat-body").append(typingEl);
    scrollToBottom();
    return typingId;
}

function removeTyping(id) {
    $("#" + id).remove();
}

function scrollToBottom() {
    const body = $("#chat-body");
    body.scrollTop(body[0].scrollHeight);
}
</script>
</body>
</html>
