<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI Chatbot</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
    body {
        background: linear-gradient(135deg, #a18cd1, #fbc2eb);
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        font-family: Arial, sans-serif;
    }

    .chat-container {
        background: rgba(255, 255, 255, 0.95);
        width: 100%;
        max-width: 600px;
        height: 90vh;
        display: flex;
        flex-direction: column;
        border-radius: 20px;
        overflow: hidden;
        box-shadow: 0px 8px 25px rgba(0,0,0,0.2);
        backdrop-filter: blur(8px);
    }

    .chat-header {
        background: #7b2cbf;
        color: white;
        padding: 15px;
        font-size: 18px;
        font-weight: bold;
    }

    .chat-body {
        flex: 1;
        overflow-y: auto;
        padding: 15px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        background: #f8f6ff;
    }

    .message {
        padding: 12px 16px;
        border-radius: 18px;
        max-width: 75%;
        opacity: 0;
        transform: translateY(10px);
        animation: fadeInUp 0.3s forwards;
    }

    .message.user {
        background-color: #9d4edd;
        color: white;
        align-self: flex-end;
    }

    .message.bot {
        background-color: white;
        color: black;
        border: 1px solid #ddd;
        align-self: flex-start;
    }

    @keyframes fadeInUp {
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .chat-footer {
        background: #f1f1f1;
        padding: 10px;
        display: flex;
        gap: 8px;
    }

    .chat-footer input {
        flex: 1;
        border-radius: 20px;
        border: 1px solid #ccc;
        padding: 10px;
    }

    .chat-footer button {
        background: #7b2cbf;
        border: none;
        color: white;
        border-radius: 50%;
        width: 45px;
        height: 45px;
        font-size: 18px;
    }

    /* Typing animation */
    .typing {
        display: inline-block;
        background: white;
        border: 1px solid #ddd;
        padding: 10px 16px;
        border-radius: 18px;
        color: #666;
        font-size: 14px;
        align-self: flex-start;
    }

    .typing span {
        display: inline-block;
        animation: blink 1s infinite;
    }

    .typing span:nth-child(2) {
        animation-delay: 0.2s;
    }

    .typing span:nth-child(3) {
        animation-delay: 0.4s;
    }

    @keyframes blink {
        0%, 80%, 100% { opacity: 0; }
        40% { opacity: 1; }
    }
</style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">💬AI Chatbot</div>
    <div id="chat-body" class="chat-body"></div>
    <div class="chat-footer">
        <input type="text" id="message-input" placeholder="Type a message...">
        <button id="send-button">➤</button>
    </div>
</div>

<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
$(document).ready(function () {
    $("#send-button").click(sendMessage);
    $("#message-input").keypress(function (e) {
        if (e.which === 13) sendMessage();
    });

    function sendMessage() {
        var userMessage = $("#message-input").val().trim();
        if (!userMessage) return;

        appendMessage(userMessage, "user");
        $("#message-input").val("");

        var typingId = appendTyping();

        $.ajax({
            url: "/chat",
            type: "POST",
            contentType: "application/json",
            data: JSON.stringify({ message: userMessage }),
            success: function (data) {
                removeTyping(typingId);
                appendMessage(data.reply, "bot");
            },
            error: function (xhr) {
                removeTyping(typingId);
                appendMessage("⚠️ Error: Could not send message.", "bot");
            }
        });
    }

    function appendMessage(text, sender) {
        var msg = $('<div class="message ' + sender + '">' + text + '</div>');
        $("#chat-body").append(msg);
        scrollToBottom();
    }

    function appendTyping() {
        var typingId = "typing-" + Date.now();
        var typingEl = $('<div id="' + typingId + '" class="typing"><span>.</span><span>.</span><span>.</span></div>');
        $("#chat-body").append(typingEl);
        scrollToBottom();
        return typingId;
    }

    function removeTyping(id) {
        $("#" + id).remove();
    }

    function scrollToBottom() {
        $("#chat-body").scrollTop($("#chat-body")[0].scrollHeight);
    }
});
</script>

</body>
</html>
