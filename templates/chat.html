<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickGPT - Chat</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", sans-serif;
      background: #f6f6f9;
      height: 100vh;
      overflow: hidden;
    }

    .main {
      display: flex;
      height: 100vh;
    }

    /* Sidebar */
    .sidebar {
      width: 280px;
      background: #333369fb;
      color: white;
      padding: 18px;
      display: flex;
      flex-direction: column;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .brand-logo {
      width: 45px;
      height: 45px;
      border-radius: 14px;
      background: linear-gradient(135deg, #7a2cff, #5b6bff);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 800;
    }

    .brand h3 {
      margin: 0;
      font-size: 18px;
      font-weight: 800;
    }

    .new-btn {
      width: 100%;
      background: #6c63ff;
      border: none;
      padding: 12px;
      border-radius: 12px;
      color: white;
      font-weight: 700;
      margin-bottom: 20px;
    }

    .menu {
      flex: 1;
    }

    .menu-item {
      padding: 12px;
      border-radius: 12px;
      cursor: pointer;
      margin-bottom: 10px;
      background: rgba(255,255,255,0.05);
      transition: 0.2s;
    }

    .menu-item:hover {
      background: rgba(255,255,255,0.12);
    }

    .upgrade-btn {
      margin-top: 20px;
      background: #7a2cff;
      padding: 12px;
      border-radius: 12px;
      text-align: center;
      font-weight: 700;
      cursor: pointer;
    }

    /* Chat Section */
    .chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: white;
    }

    .chat-header {
      padding: 15px 20px;
      border-bottom: 1px solid #ddd;
      font-weight: 700;
      font-size: 18px;
      background: #ffffff;
    }

    .chat-body {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      background: #f6f6f9;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .message {
      max-width: 70%;
      padding: 12px 16px;
      border-radius: 14px;
      font-size: 15px;
      line-height: 1.5;
    }

    .user {
      align-self: flex-end;
      background: #6c63ff;
      color: white;
      border-bottom-right-radius: 4px;
    }

    .bot {
      align-self: flex-start;
      background: white;
      border: 1px solid #ddd;
      color: #111;
      border-bottom-left-radius: 4px;
    }

    .typing {
      align-self: flex-start;
      background: white;
      border: 1px solid #ddd;
      padding: 10px 14px;
      border-radius: 14px;
      display: flex;
      gap: 5px;
      width: fit-content;
    }

    .dot {
      width: 6px;
      height: 6px;
      background: gray;
      border-radius: 50%;
      animation: blink 1.2s infinite;
    }

    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes blink {
      0%, 80%, 100% { opacity: 0.2; }
      40% { opacity: 1; }
    }

    /* Input */
    .chat-input {
      padding: 15px;
      border-top: 1px solid #ddd;
      display: flex;
      gap: 10px;
      background: white;
    }

    .chat-input input {
      flex: 1;
      padding: 12px 15px;
      border-radius: 14px;
      border: 1px solid #ccc;
      outline: none;
    }

    .chat-input button {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: #6c63ff;
      color: white;
      border: none;
      font-size: 18px;
      font-weight: 800;
    }
  </style>
</head>

<body>

  <div class="main">

    <!-- Sidebar -->
    <div class="sidebar">
      <div class="brand">
        <div class="brand-logo">Q</div>
        <div>
          <h3>QuickGPT</h3>
          <small style="opacity:0.7;">AI Assistant</small>
        </div>
      </div>

      <button class="new-btn" onclick="clearChat()">+ Create new</button>

      <div class="menu">
        <div class="menu-item">🏠 Home</div>
        <div class="menu-item">📂 Saved Chats</div>
        <div class="menu-item">📌 Dashboard</div>
        <div class="menu-item">⚙ Settings</div>
      </div>

      <div class="upgrade-btn">Upgrade Now</div>
    </div>

    <!-- Chat Area -->
    <div class="chat-area">

      <div class="chat-header">Chatsonic Style Chat</div>

      <div class="chat-body" id="chatBody">
        <div class="message bot">
          Hello 👋 I am QuickGPT. Ask me anything!
        </div>
      </div>

      <div class="chat-input">
        <input type="text" id="userInput" placeholder="Type your message...">
        <button onclick="sendMessage()">➤</button>
      </div>

    </div>
  </div>

<script>
  const chatBody = document.getElementById("chatBody");
  const userInput = document.getElementById("userInput");

  userInput.addEventListener("keypress", function(e) {
    if (e.key === "Enter") sendMessage();
  });

  function appendMessage(text, type) {
    const msg = document.createElement("div");
    msg.classList.add("message");

    if (type === "user") msg.classList.add("user");
    else msg.classList.add("bot");

    msg.innerText = text;
    chatBody.appendChild(msg);
    chatBody.scrollTop = chatBody.scrollHeight;
  }

  function showTyping() {
    const typing = document.createElement("div");
    typing.classList.add("typing");
    typing.id = "typing";

    typing.innerHTML = `
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    `;

    chatBody.appendChild(typing);
    chatBody.scrollTop = chatBody.scrollHeight;
  }

  function removeTyping() {
    const typing = document.getElementById("typing");
    if (typing) typing.remove();
  }

  async function sendMessage() {
    const msg = userInput.value.trim();
    if (!msg) return;

    appendMessage(msg, "user");
    userInput.value = "";

    showTyping();

    try {
      const response = await fetch("/chat", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({message: msg})
      });

      const data = await response.json();

      removeTyping();
      appendMessage(data.reply, "bot");

    } catch (error) {
      removeTyping();
      appendMessage("⚠️ Server error. Try again.", "bot");
    }
  }

  function clearChat() {
    chatBody.innerHTML = `
      <div class="message bot">
        Hello 👋 I am QuickGPT. Ask me anything!
      </div>
    `;
  }
</script>

</body>
</html>
