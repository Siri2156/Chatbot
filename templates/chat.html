<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QuickGPT UI</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    :root {
      --bg: #ffffff;
      --text: #000000;
      --sidebar-bg: #f7f7f7;
      --card-bg: #ffffff;
      --border: #e0e0e0;
      --btn-bg: #5b6bff;
      --btn-text: #ffffff;
      --input-bg: #f2f2f2;
      --purple: #7a2cff;
      --bot-bg: #f4f4f4;
      --user-bg: #7a2cff;
    }

    body.dark {
      --bg: #0b0b0f;
      --text: #ffffff;
      --sidebar-bg: #101015;
      --card-bg: #14141b;
      --border: rgba(255,255,255,0.1);
      --btn-bg: #5b6bff;
      --btn-text: #ffffff;
      --input-bg: #1c1c26;
      --purple: #9a4dff;
      --bot-bg: #1c1c26;
      --user-bg: #9a4dff;
    }

    body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", sans-serif;
      height: 100vh;
      overflow: hidden;
    }

    .main-container {
      display: flex;
      height: 100vh;
      width: 100%;
    }

    /* Sidebar */
    .sidebar {
      width: 320px;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--border);
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-icon {
      width: 45px;
      height: 45px;
      border-radius: 12px;
      background: linear-gradient(135deg, #7a2cff, #5b6bff);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 20px;
      color: white;
      font-weight: bold;
    }

    .logo-text h2 {
      font-size: 20px;
      margin: 0;
      font-weight: 700;
    }

    .logo-text p {
      margin: 0;
      font-size: 13px;
      color: var(--purple);
      font-weight: 500;
    }

    .new-chat-btn {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: none;
      background: var(--btn-bg);
      color: var(--btn-text);
      font-weight: 600;
      font-size: 15px;
      transition: 0.2s;
    }

    .new-chat-btn:hover {
      opacity: 0.9;
    }

    .search-box {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      outline: none;
    }

    .section-title {
      font-size: 14px;
      font-weight: 700;
      margin-top: 5px;
    }

    .chat-item {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      cursor: pointer;
      transition: 0.2s;
    }

    .sidebar-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      font-size: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }

    .toggle-switch {
      width: 50px;
      height: 25px;
      background: #bbb;
      border-radius: 20px;
      position: relative;
      cursor: pointer;
      transition: 0.3s;
    }

    .toggle-switch::before {
      content: "";
      width: 20px;
      height: 20px;
      background: white;
      border-radius: 50%;
      position: absolute;
      top: 2.5px;
      left: 3px;
      transition: 0.3s;
    }

    body.dark .toggle-switch {
      background: var(--purple);
    }

    body.dark .toggle-switch::before {
      left: 26px;
    }

    /* Chat Area */
    .chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* Chat Messages */
    .chat-body {
      flex: 1;
      padding: 25px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .message {
      max-width: 70%;
      padding: 12px 15px;
      border-radius: 15px;
      font-size: 15px;
      line-height: 1.5;
      word-wrap: break-word;
    }

    .user-message {
      align-self: flex-end;
      background: var(--user-bg);
      color: white;
      border-bottom-right-radius: 5px;
    }

    .bot-message {
      align-self: flex-start;
      background: var(--bot-bg);
      border: 1px solid var(--border);
      color: var(--text);
      border-bottom-left-radius: 5px;
    }

    /* Typing bubble */
    .typing {
      align-self: flex-start;
      background: var(--bot-bg);
      border: 1px solid var(--border);
      padding: 10px 15px;
      border-radius: 15px;
      width: fit-content;
      display: flex;
      gap: 5px;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: gray;
      animation: blink 1.2s infinite;
    }

    .dot:nth-child(2) {
      animation-delay: 0.2s;
    }

    .dot:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes blink {
      0%, 80%, 100% { opacity: 0.2; }
      40% { opacity: 1; }
    }

    /* Bottom input */
    .chat-input-box {
      width: 80%;
      max-width: 900px;
      margin: 15px auto;
      background: var(--input-bg);
      border-radius: 35px;
      display: flex;
      align-items: center;
      padding: 10px 15px;
      border: 1px solid var(--border);
    }

    .chat-input-box select {
      border: none;
      background: transparent;
      color: var(--text);
      font-weight: 600;
      outline: none;
      margin-right: 10px;
    }

    .chat-input-box input {
      flex: 1;
      border: none;
      background: transparent;
      outline: none;
      color: var(--text);
      font-size: 15px;
    }

    .send-btn {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      background: var(--purple);
      border: none;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div class="main-container">

    <!-- Sidebar -->
    <div class="sidebar">

      <div class="logo">
        <div class="logo-icon">✨</div>
        <div class="logo-text">
          <h2>QuickGPT</h2>
          <p>Intelligent AI Assistant</p>
        </div>
      </div>

      <button class="new-chat-btn" onclick="clearChat()">+ New Chat</button>

      <input type="text" class="search-box" placeholder="Search conversations">

      <div>
        <div class="section-title">Recent Chats</div>
        <div class="chat-item mt-2">
          <strong>New Chat</strong>
          <small>Just now</small>
        </div>
      </div>

      <div class="sidebar-card">
        <span>🖼 Community Images</span>
      </div>

      <div class="sidebar-card">
        <span>💎 Credits : 2</span>
      </div>

      <div class="sidebar-card">
        <span>🌙 Dark Mode</span>
        <div class="toggle-switch" id="darkToggle"></div>
      </div>

      <div class="sidebar-card">
        <span>👤 Siri</span>
      </div>

    </div>

    <!-- Chat Area -->
    <div class="chat-area">

      <!-- Messages -->
      <div id="chat-body" class="chat-body">
        <div class="message bot-message">
          Hello 👋 I'm QuickGPT. Ask me anything!
        </div>
      </div>

      <!-- Input -->
      <div class="chat-input-box">
        <select>
          <option>Text</option>
        </select>

        <input type="text" id="userInput" placeholder="Type your prompt here..." />

        <button class="send-btn" onclick="sendMessage()">➤</button>
      </div>

    </div>

  </div>

<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
  const toggle = document.getElementById("darkToggle");
  const chatBody = document.getElementById("chat-body");
  const inputBox = document.getElementById("userInput");

  toggle.addEventListener("click", () => {
    document.body.classList.toggle("dark");
  });

  inputBox.addEventListener("keypress", function (e) {
    if (e.key === "Enter") {
      sendMessage();
    }
  });

  function appendMessage(text, type) {
    const msg = document.createElement("div");
    msg.classList.add("message");

    if (type === "user") msg.classList.add("user-message");
    else msg.classList.add("bot-message");

    msg.innerText = text;
    chatBody.appendChild(msg);
    chatBody.scrollTop = chatBody.scrollHeight;
  }

  function showTyping() {
    const typingDiv = document.createElement("div");
    typingDiv.classList.add("typing");
    typingDiv.id = "typing";

    typingDiv.innerHTML = `
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    `;

    chatBody.appendChild(typingDiv);
    chatBody.scrollTop = chatBody.scrollHeight;
  }

  function removeTyping() {
    const typingDiv = document.getElementById("typing");
    if (typingDiv) typingDiv.remove();
  }

  async function sendMessage() {
    const message = inputBox.value.trim();
    if (message === "") return;

    appendMessage(message, "user");
    inputBox.value = "";

    showTyping();

    try {
      const response = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: message })
      });

      const data = await response.json();
      removeTyping();
      appendMessage(data.reply, "bot");

    } catch (error) {
      removeTyping();
      appendMessage("⚠️ Error connecting to server.", "bot");
    }
  }

  function clearChat() {
    chatBody.innerHTML = `
      <div class="message bot-message">
        Hello 👋 I'm QuickGPT. Ask me anything!
      </div>
    `;
  }
</script>

</body>
</html>
